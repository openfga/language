# Shapes valid models can't contain (a safety net: the server rejects these models)

- name: stops the chain at a union with a single child
  json: |
    {
      "schema_version": "1.1",
      "type_definitions": [
        { "type": "user" },
        {
          "type": "document",
          "relations": {
            "viewer": { "this": {} },
            "can_view": { "union": { "child": [ { "computedUserset": { "relation": "viewer" } } ] } },
            "can_share": { "computedUserset": { "relation": "can_view" } }
          },
          "metadata": {
            "relations": {
              "viewer": { "directly_related_user_types": [ { "type": "user" } ] },
              "can_view": { "directly_related_user_types": [] },
              "can_share": { "directly_related_user_types": [] }
            }
          }
        }
      ]
    }
  checks:
    - id: a
      user: "user:anne"
      relation: can_share
      object: "document:1"
    - id: b
      user: "user:anne"
      relation: can_view
      object: "document:1"
    - id: c
      user: "user:anne"
      relation: viewer
      object: "document:1"
  expected_sent:
    - id: merged-1
      user: "user:anne"
      relation: can_view
      object: "document:1"
      for: [a, b]
    - id: c
      user: "user:anne"
      relation: viewer
      object: "document:1"
      for: [c]

