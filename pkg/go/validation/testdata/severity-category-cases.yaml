---
# Go-only fixtures for the severity, category and criticality that pkg/go attaches
# to each validation finding.
#
# They live here rather than in tests/data/dsl-semantic-validation-cases.yaml because
# that corpus is shared with pkg/js and pkg/java, and neither carries a severity or
# category concept yet. Adding the keys there breaks both suites: pkg/java reads the
# corpus through a bare YAMLMapper onto case classes with no @JsonIgnoreProperties, so
# Jackson rejects an unrecognised key outright, and pkg/js asserts each expected error
# with toMatchObject, which fails on an expected key the error object does not carry.
# If either picks these fields up, these cases are what the shared corpus should
# absorb.
#
# Fields:
#   error_type — the slug, as it appears in metadata.errorType
#   severity   — error | warning | advisory; error means the model is invalid
#   category   — the part of the model the finding is about
#   critical   — the model as a whole is unusable, not just one relation
#   sentinel   — name of the errors.Is target in pkg/go/errors
#   scope      — which scope fields the wrapped cause must carry

- name: undefined type in a type restriction
  dsl: |
    model
      schema 1.1
    type document
      relations
        define viewer: [user]
  expected:
    - error_type: invalid-type
      severity: error
      category: object-type
      critical: false
      sentinel: ErrInvalidType
      scope:
        object_type: user

- name: duplicate type definition
  dsl: |
    model
      schema 1.1
    type user
    type document
    type document
  expected:
    - error_type: duplicated-error
      severity: error
      category: object-type
      critical: true
      sentinel: ErrDuplicateDefinition
      scope:
        object_type: document

- name: relation with no entrypoint
  dsl: |
    model
      schema 1.1
    type user
    type document
      relations
        define viewer: writer
        define writer: viewer
  expected:
    - error_type: relation-no-entry-point
      severity: error
      category: relation
      critical: true
      sentinel: ErrNoEntrypoints
      scope:
        object_type: document
        relation: viewer
    - error_type: relation-no-entry-point
      severity: error
      category: relation
      critical: true
      sentinel: ErrNoEntrypoints
      scope:
        object_type: document
        relation: writer

- name: condition defined but never referenced
  dsl: |
    model
      schema 1.1
    type user
    type document
      relations
        define viewer: [user]

    condition inRegion(x: string) {
      x == "eu"
    }
  expected:
    - error_type: condition-not-used
      severity: error
      category: condition
      critical: false
      sentinel: ErrConditionUnReferenced
      scope:
        condition: inRegion

- name: reserved keyword as a type name
  dsl: |
    model
      schema 1.1
    type user
    type self
  expected:
    - error_type: reserved-type-keywords
      severity: error
      category: object-type
      critical: false
      sentinel: ErrReservedKeywords
      scope:
        object_type: self

# A condition applied to a relation that the model never defines. Scoped to the
# relation it is applied to rather than to a definition of its own, which is what
# separates relation-condition from condition.
- name: condition applied to a relation is not defined
  dsl: |
    model
      schema 1.1
    type user
    type document
      relations
        define viewer: [user with inRegion]
  expected:
    - error_type: condition-not-defined
      severity: error
      category: relation-condition
      critical: false
      sentinel: ErrConditionUndefined
      scope:
        object_type: document
        relation: viewer
        condition: inRegion
