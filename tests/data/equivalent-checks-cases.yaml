      user: "user:anne"
      relation: viewer
      object: "document:1"
      for: [a, c]
    - id: merged-2
      user: "user:bob"
      relation: viewer
      object: "document:1"
      for: [b, d]
    - id: e
      user: "user:anne"
      relation: editor
      object: "document:1"
      for: [e]

# What isn't an alias: the chain stops at any relation that isn't exactly one other relation

- name: stops the chain at a union
  dsl: |
    model
      schema 1.1
    type user
    type document
      relations
        define viewer: [user]
        define editor: [user]
        define can_view: viewer or editor
        define can_share: can_view
  checks:
    - id: a
      user: "user:anne"
      relation: can_share
      object: "document:1"
    - id: b
      user: "user:anne"
      relation: can_view
      object: "document:1"
    - id: c
      user: "user:anne"
      relation: viewer
      object: "document:1"
  expected_sent:
    - id: merged-1
      user: "user:anne"
      relation: can_view
      object: "document:1"
      for: [a, b]
    - id: c
      user: "user:anne"
      relation: viewer
      object: "document:1"
      for: [c]

