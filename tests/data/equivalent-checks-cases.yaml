---
# Shared cases for merging equivalent checks in BatchCheck (the SDK option `merge_equivalent_checks`).
# Rules: https://github.com/openfga/rfcs/pull/40
#
# Each case has:
# - a model: `dsl`, or `json` for shapes the DSL can't write.
# - `checks`: the input checks, each with `id`, `user`, `relation`, `object`, and optionally `context` and
#   `contextual_tuples` (each tuple has `user`, `relation`, `object` and an optional `condition` with `name`
#   and optional `context`).
# - `expected_sent`: the checks to send, in order. `for` lists the input checks each one stands for.
#   A sent check uses the context and contextual tuples of the first check in `for`.
#
# equivalent-checks-cases.json has the same cases with every model as JSON (in `model`), for SDKs without a
# DSL parser. Don't edit it: after editing this file, run `make generate-equivalent-checks-json`.

# Aliases and groups

- name: merges an alias with the relation it points to
  dsl: |
    model
      schema 1.1
    type user
    type document
      relations
        define viewer: [user]
        define can_view: viewer
  checks:
    - id: a
      user: "user:anne"
      relation: viewer
      object: "document:1"
    - id: b
      user: "user:anne"
      relation: can_view
      object: "document:1"
  expected_sent:
    - id: merged-1
      user: "user:anne"
      relation: viewer
      object: "document:1"
      for: [a, b]

- name: merges an alias chain into its final relation
  dsl: |
    model
      schema 1.1
    type user
    type document
      relations
        define viewer: [user]
        define can_view: viewer
        define can_share: can_view
  checks:
    - id: a
      user: "user:anne"
      relation: can_share
      object: "document:1"
    - id: b
      user: "user:anne"
      relation: can_view
      object: "document:1"
    - id: c
      user: "user:anne"
      relation: viewer
      object: "document:1"
    - id: d
      user: "user:bob"
      relation: can_share
      object: "document:1"
  expected_sent:
    - id: merged-1
      user: "user:anne"
      relation: viewer
      object: "document:1"
      for: [a, b, c]
    - id: d
      user: "user:bob"
      relation: viewer
      object: "document:1"
      for: [d]

- name: sends a lone alias check with its final relation and the caller's id
  dsl: |
    model
      schema 1.1
    type user
    type document
      relations
        define viewer: [user]
        define can_view: viewer
        define can_share: can_view
  checks:
