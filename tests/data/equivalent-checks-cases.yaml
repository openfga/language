- name: numbers merged groups in order and skips groups of one
  dsl: |
    model
      schema 1.1
    type user
    type document
      relations
        define viewer: [user]
        define editor: [user]
        define can_view: viewer
        define can_share: can_view
  checks:
    - id: a
      user: "user:anne"
      relation: editor
      object: "document:1"
    - id: b
      user: "user:bob"
      relation: can_view
      object: "document:1"
    - id: c
      user: "user:bob"
      relation: viewer
      object: "document:1"
    - id: d
      user: "user:anne"
      relation: can_share
      object: "document:1"
    - id: e
      user: "user:anne"
      relation: viewer
      object: "document:1"
  expected_sent:
    - id: a
      user: "user:anne"
      relation: editor
      object: "document:1"
      for: [a]
    - id: merged-1
      user: "user:bob"
      relation: viewer
      object: "document:1"
      for: [b, c]
    - id: merged-2
      user: "user:anne"
      relation: viewer
      object: "document:1"
      for: [d, e]

