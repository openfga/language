    model
      schema 1.1
    type user
    type document
      relations
        define viewer: [user]
        define editor: [user]
        define can_view: viewer
        define can_share: can_view
  checks:
    - id: a
      user: "user:anne"
      relation: can_share
      object: "document:1"
    - id: b
      user: "user:bob"
      relation: viewer
      object: "document:1"
    - id: c
      user: "user:anne"
      relation: viewer
      object: "document:1"
    - id: d
      user: "user:bob"
      relation: can_view
      object: "document:1"
    - id: e
      user: "user:anne"
      relation: editor
      object: "document:1"
  expected_sent:
