- name: follows the aliases of the object's type only
  dsl: |
    model
      schema 1.1
    type user
    type folder
      relations
        define owner: [user]
        define viewer: owner
    type document
      relations
        define owner: [user]
        define viewer: [user]
  checks:
    - id: a
      user: "user:anne"
      relation: viewer
      object: "folder:1"
    - id: b
      user: "user:anne"
      relation: owner
      object: "folder:1"
    - id: c
      user: "user:anne"
      relation: viewer
      object: "document:1"
    - id: d
      user: "user:anne"
      relation: owner
      object: "document:1"
  expected_sent:
    - id: merged-1
      user: "user:anne"
      relation: owner
      object: "folder:1"
      for: [a, b]
    - id: c
      user: "user:anne"
      relation: viewer
      object: "document:1"
      for: [c]
    - id: d
      user: "user:anne"
      relation: owner
      object: "document:1"
      for: [d]

- name: sends checks in the order of each group's first check
