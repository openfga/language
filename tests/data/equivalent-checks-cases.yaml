      for: [b]
    - id: merged-1
      user: "user:anne"
      relation: viewer
      object: "document:1"
      for: [c, d]

# Usersets and wildcards

- name: sends as is a userset on the same object whose relation is the one asked for
  dsl: |
    model
      schema 1.1
    type user
    type document
      relations
        define viewer: [user, document#can_view]
        define can_view: viewer
        define can_share: can_view
  checks:
    - id: a
      user: "document:1#can_share"
      relation: can_share
      object: "document:1"
    - id: b
      user: "document:1#viewer"
      relation: viewer
      object: "document:1"
  expected_sent:
    - id: a
      user: "document:1#can_share"
      relation: can_share
      object: "document:1"
      for: [a]
    - id: b
      user: "document:1#viewer"
      relation: viewer
      object: "document:1"
      for: [b]

